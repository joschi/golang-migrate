---
name: ci tests
# One module per driver: `go list ./...` does not span nested workspace
# modules, so walk the workspace and list each module's packages in turn.
# The resulting import paths can be handed straight to `go test` from the
# repository root, which resolves them across the workspace.
discover: |
  go list -m -f '{{.Dir}}' | while read -r dir; do
    (cd "$dir" && go list -f '{{ if or (len .TestGoFiles) (len .XTestGoFiles) }} {{ .ImportPath }} {{end}}' ./...)
  done
run: go tool gotestsum --junitfile="<< outputs.junit >>" -- -race -count=1 << test.atoms >>
analysis: go tool gotestsum -- -coverprofile="<< outputs.go-coverage >>" -cover -coverpkg github.com/golang-migrate/migrate/... << test.atoms >>
options:
  dynamic-test-splitting: true
  max-auto-rerun: 3
  full-test-run-paths:
    - go.work
    - "**/go.mod"
    - .circleci/*.yml
outputs:
  junit: test-reports/tests.xml
