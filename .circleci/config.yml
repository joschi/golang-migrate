# Golang CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/guides/getting-started/language-go/ for more details
version: 2.1

orbs:
  go: circleci/go@4.0.0

jobs:
  lint:
    executor:
      name: go/default
      tag: "1.26"
    steps:
      - checkout
      - go/with-cache:
          golangci-lint: true
          steps:
            - run:
                name: Download dependencies for every module in the workspace
                command: go work sync
            - run:
                name: Lint every module in the workspace
                # golangci-lint does not cross nested module boundaries, so run
                # it once per module; each picks up the root .golangci.yml.
                # Keep the workspace active: it is what resolves the intra-repo
                # dependencies while the v5 tags do not exist yet.
                command: |
                  go list -m -f '{{.Dir}}' | while read -r dir; do
                    echo "-- $dir"
                    (cd "$dir" && golangci-lint run)
                  done

  test:
    parameters:
      go-version:
        type: string
    machine:
      # https://circleci.com/docs/reference/configuration-reference/#available-linux-machine-images-cloud
      image: ubuntu-2404:2025.09.1
    # https://circleci.com/docs/reference/configuration-reference/#linuxvm-execution-environment
    resource_class: medium
    parallelism: 4
    steps:
      - checkout
      - go/install:
          version: << parameters.go-version >>
      - go/with-cache:
          steps:
            - run:
                name: Download dependencies for every module in the workspace
                command: go work sync
            - run:
                command: circleci run testsuite "ci tests"
                no_output_timeout: 20m
            - store_test_results:
                path: test-reports

workflows:
  lint-and-test:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              go-version: ["1.26.4"]
